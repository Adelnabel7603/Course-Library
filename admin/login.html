<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>دخول الإدارة · مكتبة المقررات</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./admin.css" />
    <script type="module" src="./login.js"></script>
  </head>
  <body>
    <main class="auth-card">
      <a class="back-link" href="../">← العودة إلى المكتبة</a>
      <span class="brand-mark" aria-hidden="true">م</span>
      <p class="eyebrow">منطقة محمية</p>
      <h1>دخول الإدارة</h1>
      <p class="muted">سجّل الدخول بحساب الإدارة للوصول إلى لوحة التحكم.</p>
      <form id="login-form">
        <label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required /></label>
        <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="primary-button" type="submit">تسجيل الدخول</button>
        <p class="form-message" id="login-message" role="alert" hidden></p>
      </form>
    </main>
  </body>
</html>
