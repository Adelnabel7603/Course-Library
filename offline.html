<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17264b" />
    <title>غير متصل · مكتبة المقررات</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      :root { color-scheme: light; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #1c2340; background: #f5f6fb; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #e1e5ef; border-radius: 10px; background: #fff; box-shadow: 0 16px 42px rgb(25 37 75 / 8%); text-align: center; }
      img { width: 64px; height: 64px; border-radius: 9px; }
      h1 { margin: 18px 0 8px; color: #17264b; font-size: 1.4rem; }
      p { margin: 0; color: #707992; line-height: 1.8; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 20px; padding: 9px 16px; border-radius: 8px; color: #fff; background: #5144a5; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #4eb6f2; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main>
      <img src="./app-icon-192.png" alt="" width="64" height="64" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>الملفات والبيانات السحابية تحتاج إلى اتصال. أعد المحاولة عند عودة الشبكة.</p>
      <a href="./">أعد المحاولة</a>
    </main>
  </body>
</html>
